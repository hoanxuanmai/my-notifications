name: Deploy Supabase Schema & Edge Functions

on:
  push:
    branches:
      - supabase
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  pull_request:
    branches:
      - supabase
      - main
    paths:
      - 'supabase/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chỉ kiểm tra (Dry run - không ghi vào database)'
        required: false
        default: false
        type: boolean

jobs:
  test_and_lint:
    name: 1. Kiểm tra cấu trúc & SQL Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Kiểm tra thư mục supabase và migration files
        run: |
          if [ ! -d "supabase" ]; then
            echo "❌ Thư mục 'supabase/' không tồn tại trong nhánh hiện tại!"
            exit 1
          fi
          echo "✅ Đã tìm thấy thư mục supabase. Danh sách files:"
          ls -la supabase/
          ls -la supabase/migrations/ || true
          ls -la supabase/functions/ || true

  deploy_to_supabase:
    name: 2. Deploy Migrations & Edge Functions lên Supabase
    needs: test_and_lint
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Kiểm tra các Secrets cấu hình
        run: |
          echo "=== KIỂM TRA CẤU HÌNH SECRETS ==="
          MISSING=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ THIẾU SECRET: SUPABASE_ACCESS_TOKEN"
            echo "👉 Vui lòng vào GitHub Repo -> Settings -> Secrets and variables -> Actions -> Tạo 'SUPABASE_ACCESS_TOKEN' (Lấy từ https://supabase.com/dashboard/account/tokens)"
            MISSING=1
          else
            echo "✅ Đã cấu hình SUPABASE_ACCESS_TOKEN"
          fi

          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "❌ THIẾU SECRET: SUPABASE_PROJECT_ID"
            echo "👉 Vui lòng vào GitHub Repo -> Settings -> Secrets and variables -> Actions -> Tạo 'SUPABASE_PROJECT_ID' (Reference ID của dự án trên Supabase)"
            MISSING=1
          else
            echo "✅ Đã cấu hình SUPABASE_PROJECT_ID: $SUPABASE_PROJECT_ID"
          fi

          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "⚠️ CẢNH BÁO: Chưa có SUPABASE_DB_PASSWORD (Có thể cần khi chạy db push nếu dùng kết nối trực tiếp)"
          else
            echo "✅ Đã cấu hình SUPABASE_DB_PASSWORD"
          fi

          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "🛑 DỪNG DEPLOY: Thiếu thông tin xác thực bí mật để kết nối với Supabase Cloud."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Supabase Project
        run: |
          echo "🔗 Đang liên kết với dự án Supabase: $SUPABASE_PROJECT_ID"
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --debug
          else
            supabase link --project-ref "$SUPABASE_PROJECT_ID" --debug
          fi

      - name: Push Database Migrations (Schema, RLS, Procedures)
        if: ${{ !(github.event.inputs.dry_run == 'true') }}
        run: |
          echo "🚀 Đang đẩy Database Migrations lên Supabase Cloud..."
          PASS_ARG=""
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            PASS_ARG="--password $SUPABASE_DB_PASSWORD"
          fi

          if ! supabase db push $PASS_ARG --debug; then
            echo "⚠️ db push gặp sự cố, kiểm tra migration list và tự động sửa chữa lịch sử..."
            supabase migration list $PASS_ARG || true
            supabase migration repair --status applied 20260901000000 20260901010000 $PASS_ARG || true
            echo "Thử lại supabase db push..."
            supabase db push $PASS_ARG --debug
          fi

      - name: Deploy Edge Functions
        if: ${{ !(github.event.inputs.dry_run == 'true') }}
        run: |
          echo "⚡ Đang deploy tất cả các Edge Functions..."
          for fn_dir in supabase/functions/*; do
            if [ -d "$fn_dir" ]; then
              fn_name=$(basename "$fn_dir")
              echo "📦 Deploying function: $fn_name..."
              supabase functions deploy "$fn_name" --no-verify-jwt || echo "⚠️ Cảnh báo: Lỗi khi deploy $fn_name"
            fi
          done

      - name: Generate TypeScript Types
        run: |
          echo "📝 Đang sinh TypeScript Types từ database..."
          supabase gen types typescript --linked > types_supabase.ts || supabase gen types typescript --project-id "$SUPABASE_PROJECT_ID" > types_supabase.ts || true
          echo "✅ Hoàn tất quá trình Deploy!"
